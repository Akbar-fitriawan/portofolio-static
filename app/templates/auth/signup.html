{% extends 'base.html' %} {% block title %}Signup{% endblock %} {% block content
%}
<section class="pt-10 pb-12 bg-slate-200 dark:bg-slate-800">
  <div class="container">
    <div class="max-w-xl mx-auto">
      <div
        class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0"
      >
        <div class="w-full px-4">
          <div class="max-w-xl mx-auto text-center mb-28">
            <h2
              class="text-4xl font-bold text-center text-blue-950 mb-10 dark:text-white"
            >
              Signup <span class="text-teal-500">Blog</span>
            </h2>
          </div>
        </div>
        <div
          class="w-full bg-white rounded-lg shadow-lg shadow-blue-800 dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700"
        >
          <div class="flex flex-col items-center justify-center">
            {% with messages = get_flashed_messages() %} {% if messages %}
            <div class="font-medium text-red-500 py-4">
              {{ messages[0] }}. Go to
              <a class="hover:underline" href="{{ url_for('auth.login' ) }}"
                >Login page</a
              >
            </div>
            {% endif %} {% endwith %}
          </div>
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
            <form
              class="space-y-4 md:space-y-6"
              action="{{ url_for('auth.signup' ) }}"
              method="post"
            >
              <div>
                <label
                  for="email"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Your email</label
                >

                <input
                  class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  type="email"
                  name="email"
                  placeholder="name@company.com"
                  required
                />
              </div>

              <div>
                <label
                  for="name"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Name</label
                >

                <input
                  class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  type="text"
                  name="name"
                  placeholder="Admin"
                  required
                />
              </div>
              <div>
                <label
                  for="password"
                  class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                  >Password</label
                >
                <input
                  class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  type="password"
                  name="password"
                  required
                />
              </div>
              <div class="flex flex-col items-center mx-auto">
                <button
                  type="submit"
                  class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"
                >
                  Signup
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock%}
